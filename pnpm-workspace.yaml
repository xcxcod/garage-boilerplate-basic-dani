packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'

  # Force js-yaml to a patched version to address the security vulnerability
  # reported by pnpm audit.
  'js-yaml': '^4.3.1'

  # Force nanoid to a patched version to address the security vulnerability
  # reported by pnpm audit.
  'nanoid': '^3.3.17'

  # Next.js can pull in a vulnerable PostCSS version.
  # Force PostCSS to a patched 8.x version.
  postcss: '^8.5.18'

  # Next.js can pull in an older sharp version for image optimization.
  # Force sharp to the patched 0.35.x line.
  sharp: '^0.35.0'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true